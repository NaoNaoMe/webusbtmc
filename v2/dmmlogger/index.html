<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>WebUSBTMC DMM Logger</title>
  <script src="../common/theme.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha256-2FMn2Zx6PuH5tdBQDRNwrOo60ts5wWPC9R8jK67b3t4=" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" integrity="sha256-ecmcGh4Ok3+AilgWVyi37QCADwLvXvz80Q3+cUZOZ10=" crossorigin="anonymous">
  <link rel="stylesheet" href="../common/common.css">
  <link rel="stylesheet" href="dmmlogger.css">
</head>

<body>
  <div class="app">
    <header class="appbar">
      <a class="brand" href="../../">WebUSBTMC<span class="chip">v2</span></a>
      <h1 class="visually-hidden">Log the readings of DMMs</h1>
      <button class="btn btn-outline-secondary theme-toggle" type="button" data-theme-toggle><i class="bi bi-circle-half"></i></button>
    </header>

    <section class="card-lite controls">
      <button type="button" class="btn btn-primary" id="start-button" disabled>
        <i class="bi bi-play-fill me-1"></i>Start
      </button>
      <div class="interval">
        <label class="field-label" for="interval-select">Interval</label>
        <select class="form-select" id="interval-select"></select>
      </div>
      <div class="status" id="status" aria-live="polite">Connect a DMM to start.</div>
      <button type="button" class="btn btn-outline-secondary" id="howto-button">
        <i class="bi bi-info-circle me-1"></i>How to use
      </button>
    </section>

    <div id="alerts"></div>

    <div class="dmm-grid" id="cards"></div>

    <section class="card-lite panel">
      <div class="panel-head">
        <h2>Readings</h2>
        <div class="row-actions">
          <button type="button" class="btn btn-outline-secondary" id="save-button" disabled>
            <i class="bi bi-download me-1"></i>Save CSV
          </button>
          <label class="btn btn-outline-secondary file-label" id="open-label" for="open-input">
            <i class="bi bi-folder2-open me-1"></i>Open CSV
          </label>
          <input class="d-none" type="file" id="open-input" accept=".csv,text/csv">
          <button type="button" class="btn btn-outline-secondary" id="clear-button" disabled>
            <i class="bi bi-trash me-1"></i>Clear
          </button>
        </div>
      </div>
      <p class="note mb-2" id="source-note">The readings appear here. Open a CSV file of the logger to look at it without a DMM.</p>
      <div class="chart-box"><canvas id="chart" aria-label="Readings against the time"></canvas></div>
      <p class="note skip-note d-none" id="skip-note"></p>
    </section>

    <footer class="foot">
      <span>Windows needs the WinUSB driver: <a href="https://github.com/ananswer/webusbtmc/#windows">setup guide</a></span>
    </footer>
  </div>

  <template id="howto-body" data-title="How to use the DMM logger">
    <p>Record the readings of one or two DMMs and keep them as a CSV file.</p>
    <ol>
      <li><strong>Connect.</strong> Press <b>Connect</b> on a card and choose your DMM in the dialog of the browser. Use the second card for a second DMM.</li>
      <li><strong>Choose.</strong> Give the DMM a name and choose what it measures. The range is automatic.</li>
      <li><strong>Start.</strong> Choose the interval and press <b>Start</b>. The readings are drawn as they come. Press <b>Stop</b> to end.</li>
      <li><strong>Save.</strong> Press <b>Save CSV</b>. The file keeps the time of every reading and can be opened in a spreadsheet.</li>
    </ol>
    <h6>Looking at a file</h6>
    <p><b>Open CSV</b> shows a file of the logger again, with the smallest, the largest and the mean of each DMM. No DMM is needed.</p>
    <h6>Good to know</h6>
    <ul>
      <li>The readings are kept only in this page. Save them before you close the page or reload it.</li>
      <li>The DMM sets how fast it measures (the integration time). If it needs more time than the interval, the page skips readings and tells you. Use a longer interval.</li>
      <li>The time of a reading is the clock of this computer. The two DMMs are asked together, so their readings are a few milliseconds apart.</li>
      <li>A reading over the range is left empty in the file.</li>
    </ul>
    <h6>For a long recording</h6>
    <ul>
      <li>Keep the page in front, and do not close the tab. A page that is hidden or asleep may stop logging.</li>
      <li>Set the screen and the computer not to sleep. This page does not do that for you.</li>
      <li>On a phone: connect it to a charger, turn the screen timeout off, and lower the brightness.</li>
    </ul>
    <h6>Instruments</h6>
    <p>Made for Keysight (Agilent) DMMs. A modular DMM of the U27xx series must be switched to USBTMC mode first.</p>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js" integrity="sha256-SERKgtTty1vsDxll+qzd4Y2cF9swY9BCq62i9wXJ9Uo=" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha256-5P1JGBOIxI7FBAvT/mb1fCnI5n/NhQKzNUuW7Hq0fMc=" crossorigin="anonymous"></script>
  <script type="module" src="dmmlogger.js"></script>
</body>

</html>
